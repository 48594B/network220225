function score(d,a){const n=norm(a),dn=norm(d.name);let s=0;if(zipMatch(a.zipcode,d.zip))s+=100;if(n.includes(dn))s+=70;if(dn.includes(n))s+=30;return s}
function findMatch(a){let candidates=DATA.map(d=>({d,s:score(d,a)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s);return candidates[0]||null}
function renderLocal(q){q=q.trim();if(!q){$('list').classList.remove('show');return}const nq=norm(q);let arr=DATA.map(d=>{let s=norm(d.name);let score=s.includes(nq)?100-(s.length-nq.length):0;return {d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);const list=$('list');if(!arr.length){list.innerHTML='<div class="empty">특수지역 기준에서 일치하는 주소가 없습니다. 주소 검색 버튼을 이용하세요.</div>';list.classList.add('show');return}list.innerHTML=arr.map((x,i)=>`<button class="item" data-i="${i}"><b>${x.d.name}</b><span>우편번호 ${x.d.zip} · 배송비 ${x.d.fee.toLocaleString()}원</span></button>`).join('');list.classList.add('show');[...list.querySelectorAll('.item')].forEach((el,i)=>el.onclick=()=>selectData(arr[i].d));}
function selectData(d){selected={zipcode:d.zip,roadAddress:d.name,jibunAddress:d.name};$('query').value=d.name;$('list').classList.remove('show');$('selected').style.display='block';$('zip').textContent='우편번호 '+d.zip;$('addr').textContent=d.name;$('result').classList.remove('show')}
function openPostcode(){ $('modal').classList.add('show');new daum.Postcode({oncomplete:function(data){selected=data;$('query').value=data.roadAddress||data.jibunAddress||data.address;$('zip').textContent='우편번호 '+data.zonecode;$('addr').textContent=(data.roadAddress||data.jibunAddress||data.address);$('selected').style.display='block';$('result').classList.remove('show');$('modal').classList.remove('show');$('list').classList.remove('show')}}).embed($('postcode'));}
$('searchBtn').onclick=openPostcode;$('query').addEventListener('input',e=>renderLocal(e.target.value));$('query').addEventListener('keydown',e=>{if(e.key==='Enter')openPostcode()});$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});$('checkBtn').onclick=()=>{if(!selected)return;const m=findMatch(selected);const fee=m?m.d.fee:3000;$('fee').textContent=fee.toLocaleString()+'원';$('matched').textContent=m?'기준 매칭: '+m.d.name+' · 우편번호 '+m.d.zip:'기준 데이터에 없는 주소 · 기본 배송비 적용';$('result').classList.add('show')};</script></body></html>
